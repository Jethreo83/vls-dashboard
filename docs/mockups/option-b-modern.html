<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: #14151a;
    color: #e8e9ed;
  }
  .app { display: flex; min-height: 600px; }
  .sidebar {
    width: 210px;
    background: #0d0e12;
    padding: 24px 16px;
    flex-shrink: 0;
    border-right: 1px solid #1f2128;
  }
  .sidebar .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: #fff;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #5eead4; }
  .sidebar nav a {
    display: block;
    color: #8b8d97;
    text-decoration: none;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 2px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .sidebar nav a.active { background: #1a2a28; color: #5eead4; }
  .main { flex: 1; padding: 28px 36px; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .user-chip {
    font-size: 12.5px;
    color: #6b6d78;
    background: #1a1b21;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #24262e;
  }
  .cards { display: flex; gap: 12px; margin-bottom: 28px; }
  .card {
    background: #1a1b21;
    border: 1px solid #24262e;
    border-radius: 10px;
    padding: 16px 18px;
    flex: 1;
  }
  .card .label { font-size: 11px; color: #6b6d78; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 24px; font-weight: 700; color: #fff; }
  .card .value.warn { color: #f87171; }
  .card .value.ok { color: #5eead4; }
  table { width: 100%; border-collapse: collapse; background: #1a1b21; border-radius: 10px; overflow: hidden; border: 1px solid #24262e; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #6b6d78; padding: 12px 16px; border-bottom: 1px solid #24262e; }
  td { padding: 13px 16px; font-size: 13.5px; border-bottom: 1px solid #1f2128; color: #d4d5db; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .badge.jp { background: #1a2438; color: #7dabf8; }
  .badge.blocked { background: #34191c; color: #f87171; }
  a.view { color: #5eead4; text-decoration: none; font-weight: 600; font-size: 12.5px; margin-left: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand"><span class="dot"></span>VLS Dashboard</div>
    <nav>
      <a class="active">Cases</a>
      <a>Legal Deadlines</a>
      <a>Tasks</a>
      <a>Analytics</a>
    </nav>
  </div>
  <div class="main">
    <div class="topbar">
      <h1>Cases</h1>
      <span class="user-chip">jed@vlslawfirm.com · admin</span>
    </div>
    <div class="cards">
      <div class="card"><div class="label">Total Cases</div><div class="value">2</div></div>
      <div class="card"><div class="label">Blocked</div><div class="value warn">2</div></div>
      <div class="card"><div class="label">Overdue Tasks</div><div class="value warn">2</div></div>
      <div class="card"><div class="label">Fee-Shifting</div><div class="value ok">2 / 2</div></div>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Type</th><th>Court</th><th>State</th><th>Fee-Shifting</th><th></th></tr></thead>
      <tbody>
        <tr><td>1</td><td>Unpaid Repairs</td><td><span class="badge jp">JP</span></td><td>Discovery Open</td><td>Yes</td><td><span class="badge blocked">⚠ Blocked</span><a class="view" href="#">View →</a></td></tr>
        <tr><td>2</td><td>Unpaid Repairs</td><td><span class="badge jp">JP</span></td><td>Intake</td><td>Yes</td><td><span class="badge blocked">⚠ Blocked</span><a class="view" href="#">View →</a></td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
